<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Update The Order</title>
</head>
<body>
	<section style="height:100vh";>
		<div class="container">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="my-card mt-1">
				      <div class="container text-center">
				      	<img class="" style="width:80px;" th:src="@{/img/membership.png}"/>
				      </div>
						<h1 class="text-center">Update Order Data!!</h1>
						<form action="" th:action="@{/update-order}" method="post">
						 <div class="alert alert-danger" th:if="${updatecustomerdata}"  role="alert">
  								<h6 th:text="${updatecustomerdata}"></h6>
							</div>
							<div class="mb-3">
							    <label for="name_field" class="form-label">Old Product Name </label>
							    <input type="text" class="form-control" name="oldproductName" id="name_field" aria-describedby="emailHelp" placeholder="Enter Old Product Name" required>
							 </div>
							 <div class="mb-3">
							    <label for="name_field" class="form-label">Enter Customer Email </label>
							    <input type="email" class="form-control" name="email" id="name_field" aria-describedby="emailHelp" placeholder="Enter Customer Email" required>
							 </div>
							 <div class="mb-3">
							    <label for="name_field" class="form-label">New Product Name </label>
							    <input type="text" class="form-control" name="productName" id="name_field" aria-describedby="emailHelp" placeholder="Enter New Product Name" required>
							 </div>
							  <div class="mb-3">
							    <label for="quantity_field" class="form-label">New Quantity</label>
							    <input type="number" class="form-control" name="quantity" id="quantity_field" aria-describedby="emailHelp" placeholder="Enter New Product Quantity" required>
							 </div>
							 
							 <div class="mb-3">
							    <label for="email_field" class="form-label">New Price</label>
							    <input type="number" class="form-control" name="price" id="email_field" aria-describedby="emailHelp" placeholder="Enter New Product Price" required>
							 </div>
							 
							 <div class="mb-3">
							    <label for="address_field" class="form-label">New Date</label>
							    <input type="text" class="form-control" name="date" id="address_field" aria-describedby="emailHelp" placeholder="Enter New The Date" required>
							 </div>

							 <div class="form-group form-check">
								<input type="checkbox" name="agreement" class="form-check-input" id="agreement"/>
								<label for="agreement">Accept terms and conditions</label>
							</div>
							 
							 <div class="container text-center">
							 	<button type="submit"  class="btn bg-primary text-white">
							 		Update Order
							 	</button>
							 	<button type="reset" class="btn btn-warning text-white">
							 		Reset
							 	</button>
							 </div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
