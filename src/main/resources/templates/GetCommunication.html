<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Loop Example</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<section style="height:90vh">
	<div class="h4 pb-2 mb-4 text-danger border-bottom border-danger text-center" style="padding-top:30px;">
          ....Customer Communication Details....
    </div>
	<table class="table table-sm">
          <thead class="thead-dark">
              <tr>
		          <th scope="col">Id</th>
		          <th scope="col">Date</th>
		          <th scope="col">Notes</th>
		          <th scope="col">Communication Type</th>
		          <th scope="col">Delete</th>
             </tr>
          </thead>
          <tbody>
	          <tr th:each="n :${communications}">
			      <th scope="row" th:text="${n.communicationId}"></th>
			      <td th:text="${n.intractionDate}"></td>
			      <td th:text="${n.notes}"></td>
			      <td th:text="${n.communicationType}"></td>
			      <td><a th:href="@{/deletecommunication}"><button type="button" class="btn btn-danger"><i class="fa fa-trash" aria-hidden="true"></i></button></a><td>
	         </tr>
          </tbody>
      </table>
      </section>
</body>
</html>
