<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Update The Order</title>
</head>
<body>
	<section style="height:100vh";>
		<div class="container">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="my-card mt-1">
				      <div class="container text-center">
				      	<img class="" style="width:80px;" th:src="@{/img/membership.png}"/>
				      </div>
						<h1 class="text-center">Update Communication!!</h1>
						<form action="" th:action="@{/update-communication}" method="post">
						<div th:if="${message}" th:classappend="${message.type}" class="alert" role="alert">
          					<p class="text-center" th:text="${message.content}"></p>
    					</div>
    					
						 <div class="alert alert-danger" th:if="${updatecommunicationdata}"  role="alert">
  								<h6 th:text="${updatecommunicationdata}"></h6>
							</div>
							<div class="mb-3">
							    <label for="name_field" class="form-label">Enter Intraction Date To Update The Data</label>
							    <input type="date" class="form-control" name="oldintractiondate" id="name_field" aria-describedby="emailHelp" placeholder="Enter Old Interaction Date" required>
							 </div>

							 <div class="mb-3">
							    <label for="name_field" class="form-label">Enter Customer Email To Commuicate</label>
							    <input type="text" class="form-control" name="email" id="name_field" aria-describedby="emailHelp" placeholder="Enter "Email required>
							 </div>
							 
							  <div class="mb-3">
							    <label for="contact_field" class="form-label">Enter New Date</label>
							    <input type="date" class="form-control" name="intractionDate" id="contact_field" aria-describedby="emailHelp" placeholder="Enter Date" required>
							 </div>
							 
							 <div class="mb-3">
							    <label for="email_field" class="form-label">Enter New Note</label>
							    <input type="text" class="form-control" name="notes" id="email_field" aria-describedby="emailHelp" placeholder="Enter Note" required>
							 </div>
							 
							 <div class="mb-3">
							    <label for="address_field" class="form-label">New Communication Type</label>
							    <input type="text" class="form-control" name="communicationType" id="address_field" aria-describedby="emailHelp" placeholder="Enter Communication Type " required>
							 </div>
							 
							

							 <div class="form-group form-check">
								<input type="checkbox" name="agreement" class="form-check-input" id="agreement"/>
								<label for="agreement">Accept terms and conditions</label>
							</div>
							 
							 <div class="container text-center">
							 	<button type="submit"  class="btn bg-primary text-white">
							 		Update Communication
							 	</button>
							 	<button type="reset" class="btn btn-warning text-white">
							 		Reset
							 	</button>
							 </div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
