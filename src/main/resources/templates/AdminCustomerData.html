<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Loop Example</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<section style="height:90vh">
	<div class="h4 pb-2 mb-4 text-danger border-bottom border-danger text-center" style="padding-top:30px;">
          ....Customer Data....
    </div>
	<table class="table table-sm">
          <thead class="thead-dark">
              <tr>
		          <th scope="col">Cid</th>
		          <th scope="col">Name</th>
		          <th scope="col">Contact</th>
		          <th scope="col">Email</th>
		          <th scope="col">Address</th>
		          <th scope="col">Delete</th>
		    
             </tr>
          </thead>
          <tbody>
	          <tr th:each="n :${customers}">
			      <th scope="row" th:text="${n.cid}"></th>
			      <td th:text="${n.name}"></td>
			      <td th:text="${n.contact}"></td>
			      <td th:text="${n.email}"></td>
			      <td th:text="${n.address}"></td>
			     <td><a th:href="@{/deletecustomer}"><button type="button" class="btn btn-danger"><i class="fa fa-trash" aria-hidden="true"></i></button></a><td>
  
	         </tr>
          </tbody>
      </table>
      </section>
</body>
</html>
