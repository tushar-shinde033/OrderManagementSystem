<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>this is a home page</title>
</head>
<body>
	<section style="height:100vh;">
		<div class="container">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="my-card mt-1">
				      <div class="container text-center" style="padding-top:20px;">
				      	<img class="" style="width:80px;" th:src="@{/img/membership.png}"/>
				      </div>
					
						<h1 class="text-center" style="padding-bottom:10px">Update Customer Details</h1>
						
						<div th:if="${message}" th:classappend="${message.type}" class="alert" role="alert">
          					<p class="text-center" th:text="${message.content}"></p>
    					</div>
    					
						<form action="" th:action="@{/update-customer}" method="post" th:object="${user}">
						<div class="alert alert-danger" th:if="${updateOrder}"  role="alert">
  								<h6 th:text="${updateOrder}"></h6>
							</div>
							 <div class="mb-3">
							    <label for="email_field" class="form-label">Enter Customer Email To Update Data</label>
							    <input type="email" class="form-control" name="emailAddr" id="email_field" aria-describedby="emailHelp" placeholder="Enter Email" required>
							 </div>
							 
							 <div class="mb-3">
							    <label for="name_field" class="form-label">New Customer Name</label>
							    <input type="text" class="form-control" name="name" id="name_field" aria-describedby="emailHelp" placeholder="Enter Name" required>
							 </div>
							 
							  <div class="mb-3">
							    <label for="contact_field" class="form-label">New Customer Contact</label>
							    <input type="text" class="form-control" name="contact" id="contact_field" aria-describedby="emailHelp" placeholder="Enter Contact" required>
							 </div>
							 
							 <div class="mb-3">
							    <label for="email_field" class="form-label">New Customer Email</label>
							    <input type="email" class="form-control" name="email" id="email_field" aria-describedby="emailHelp" placeholder="Enter Email" required>
							 </div>
							 
							 <div class="mb-3">
							    <label for="address_field" class="form-label">New Customer Address</label>
							    <input type="text" class="form-control" name="address" id="address_field" aria-describedby="emailHelp" placeholder="Enter Address " required>
							 </div>

							 <div class="form-group form-check">
								<input type="checkbox" name="agreement" class="form-check-input" id="agreement"/>
								<label for="agreement">Accept terms and conditions</label>
							</div>

							 <div class="container text-center">
							 	<button type="submit"  class="btn bg-primary text-white">
							 		Update
							 	</button>
							 	<button type="reset" class="btn btn-warning text-white">
							 		Reset
							 	</button>
							 </div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
