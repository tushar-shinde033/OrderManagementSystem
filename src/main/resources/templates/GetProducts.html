<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="index::layout(~{::section})">
<head>
	<meta charset="UTF-8" />
	<title>Loop Example</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
<section style="height:100vh;">
	<div class="h4 pb-2 mb-4 text-danger border-bottom border-danger text-center" style="padding-top:30px;">
          ....All Products Data....
    </div>
	<table class="table table-sm">
          <thead class="thead-dark">
              <tr>
		          <th scope="col">Product Id</th>
		          <th scope="col">Product Name</th>
		          <th scope="col">Product Description</th>
		          <th scope="col">Product Price</th>
             </tr>
          </thead>
          <tbody>
	          <tr th:each="n :${products}">
			      <th scope="row" th:text="${n.productId}"></th>
			      <td th:text="${n.productName}"></td>
			      <td th:text="${n.description}"></td>
			      <td th:text="'₹ '+${n.price}"></td>
	         </tr>
          </tbody>
      </table>
      </section>
</body>
</html>
